<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empathy Sync - রিলাক্সেশন হাব</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h1 { color: #818cf8; }
        p { color: #9ca3af; }
        .btn {
            background-color: #4f46e5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #4338ca; }
        .box {
            margin-top: 25px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            text-align: left;
        }
        ul { padding-left: 20px; color: #d1d5db; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Empathy Sync</h1>
        <p>আপনার মানসিক প্রশান্তি, ফোকাস এবং রিলাক্সেশনের জন্য একটি আধুনিক প্ল্যাটফর্ম।</p>

        <button class="btn" onclick="startRelaxation()">রিলাক্সেশন মোড শুরু করুন</button>

        <div class="box">
            <h3>☕ কফি হিরোস (সাপোর্টার্স)</h3>
            <ul id="supporter-list">
                <li>লোড হচ্ছে...</li>
            </ul>
        </div>
    </div>

    <script>
        function startRelaxation() {
            alert('রিলাক্সেশন মোড সক্রিয় হয়েছে! গভীর দীর্ঘশ্বাস নিন এবং মন শান্ত রাখুন।');
        }

        // সার্ভার থেকে সাপোর্টার লিস্ট নিয়ে আসা
        async function loadSupporters() {
            try {
                const response = await fetch('/api/supporters');
                const data = await response.json();
                const listEl = document.getElementById('supporter-list');
                listEl.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `${item.name} - ${item.coffee}`;
                    listEl.appendChild(li);
                });
            } catch (error) {
                console.error('ডেটা লোড করতে সমস্যা হয়েছে:', error);
            }
        }

        loadSupporters();
    </script>
</body>
      </html>
