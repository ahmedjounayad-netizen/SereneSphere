<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereneSphere - Ultimate Peace & Sound Sanctuary</title>
    <style>
        :root {
            --bg: #05070f;
            --card: #0e1322;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --gold: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            border: 1px solid var(--border);
            text-align: center;
        }
        
        /* Logo & Header */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .logo-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        h1 { color: #f8fafc; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 20px var(--accent-glow);
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.95; transform: translateY(-2px); }

        /* Circular Futuristic Relaxation Box */
        #relaxation-panel {
            display: none;
            margin-top: 20px;
            padding: 22px;
            background: #070a14;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .circle-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 10px auto 15px auto;
        }
        .perfect-circle {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99,102,241,0.8) 0%, rgba(79,70,229,0.3) 70%, transparent 100%);
            border: 2px solid #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: breathe-circle 4s infinite alternate ease-in-out;
        }
        @keyframes breathe-circle {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 15px rgba(99,102,241,0.3); }
            100% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 35px rgba(99,102,241,0.8); }
        }

        /* Sound Selector Dropdown */
        .sound-selector {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .sound-selector label { font-size: 11px; color: var(--muted); }
        .sound-selector select {
            padding: 10px;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        /* Leaderboard Box */
        .board-box {
            margin-top: 20px;
            padding: 16px;
            background: #070a14;
            border-radius: 20px;
            text-align: left;
            border: 1px solid var(--border);
        }
        .board-box h3 { margin: 0 0 4px 0; font-size: 13px; color: #cbd5e1; }
        .board-desc { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
        
        .supporters-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        .supporters-list li {
            background: #111827;
            padding: 9px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border: 1px solid #1e293b;
        }
        .supporter-name { font-weight: 600; color: #f8fafc; display: block; }
        .supporter-badge { font-size: 9px; color: var(--gold); }
        .supporter-coffees { background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 3px 8px; border-radius: 20px; font-weight: 700; }

        /* Support Form & PayPal Link */
        .support-form {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .support-form input, .support-form select {
            padding: 10px 12px;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 12px;
            outline: none;
        }
        .support-form input:focus { border-color: #818cf8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Home Logo & Brand Header -->
        <div class="logo-container">
            <div class="logo-badge">🌿</div>
            <h1>SereneSphere</h1>
        </div>
        <div class="subtitle">Your Futuristic Sanctuary for Mental Clarity & Peace</div>

        <!-- Main Relaxation Trigger Button -->
        <button class="btn" onclick="toggleSession()">🧘 Start Focus & Relaxation Session</button>

        <!-- Interactive Futuristic Breathing & Multi-Sound Panel -->
        <div id="relaxation-panel">
            <div class="circle-wrapper">
                <div class="perfect-circle"></div>
            </div>
            <h3 id="status-text" style="color: #818cf8; margin: 5px 0 10px 0; font-size: 14px;">Inhale Deeply...</h3>
            
            <audio id="ambient-audio" loop></audio>

            <div class="sound-selector">
                <label>🎵 Select Ambient Soundscape:</label>
                <select id="sound-dropdown" onchange="changeSound()">
                    <option value="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg">🌧️ Heavy Rain Ambience</option>
                    <option value="https://actions.google.com/sounds/v1/weather/wind_gusts.ogg">🍃 Gentle Wind Breeze</option>
                    <option value="https://actions.google.com/sounds/v1/environments/forest_birds.ogg">🐦 Forest Birds & Nature</option>
                    <option value="https://actions.google.com/sounds/v1/water/ocean_waves.ogg">🌊 Calming Ocean Waves</option>
                </select>
            </div>
        </div>

        <!-- Coffee Heroes Hall of Fame & PayPal Integration -->
        <div class="board-box">
            <h3>🏆 Coffee Heroes Hall of Fame</h3>
            <div class="board-desc">
                Support via PayPal to secure permanent top rank & high visibility on our global leaderboard.
            </div>
            
            <ul class="supporters-list" id="leaderboard">
                <li><span>Loading legends...</span></li>
            </ul>

            <!-- Support Submission Form -->
            <div class="support-form">
                <input type="text" id="donor-name" placeholder="Your Name or Brand...">
                <select id="coffee-amount">
                    <option value="1">1 Cup of Coffee ☕ ($5)</option>
                    <option value="3">3 Cups of Coffee ☕ ($15)</option>
                    <option value="5">5 Cups of Coffee ☕ ($25)</option>
                    <option value="10">10+ Legend Coffees 👑 ($50+)</option>
                </select>
                <button class="btn" style="margin-top: 0; padding: 11px; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);" onclick="processPayPalSupport()">☕ Proceed to PayPal & Claim Rank</button>
            </div>
        </div>
    </div>

    <script>
        let active = false;
        let interval;
        const audio = document.getElementById('ambient-audio');
        
        // আপনার রিয়েল পেপাল লিংক এখানে কনফিগার করা হলো
        const PAYPAL_BASE_URL = "https://paypal.me/JounayadAhmed?locale.x=en_US&country.x=OM"; 

        function toggleSession() {
            const panel = document.getElementById('relaxation-panel');
            const status = document.getElementById('status-text');
            const dropdown = document.getElementById('sound-dropdown');

            if (!active) {
                panel.style.display = 'block';
                active = true;
                audio.src = dropdown.value;
                audio.play().catch(e => console.log("Audio play restricted"));
                
                interval = setInterval(() => {
                    status.textContent = status.textContent.includes('Inhale') ? 'Exhale Gently...' : 'Inhale Deeply...';
                }, 4000);
            } else {
                panel.style.display = 'none';
                active = false;
                audio.pause();
                clearInterval(interval);
            }
        }

        function changeSound() {
            const dropdown = document.getElementById('sound-dropdown');
            if (active) {
                audio.src = dropdown.value;
                audio.play();
            }
        }

        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/supporters');
                const data = await res.json();
                const list = document.getElementById('leaderboard');
                list.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <span class="supporter-name">👤 ${item.name}</span>
                            <span class="supporter-badge">${item.badge}</span>
                        </div>
                        <span class="supporter-coffees">${item.coffees} ☕</span>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function processPayPalSupport() {
            const name = document.getElementById('donor-name').value.trim();
            const coffees = document.getElementById('coffee-amount').value;

            if (!name) return alert('Please enter your name or brand first!');

            // ব্যাকএন্ডে সাপোর্টার সেভ করা
            try {
                await fetch('/api/add-supporter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, coffees })
                });
            } catch (err) {
                console.error(err);
            }

            // আপনার পেপাল লিংকে রিডাইরেক্ট করা
            alert('Redirecting you securely to your PayPal account to complete coffee support...');
            window.open(PAYPAL_BASE_URL, '_blank');

            document.getElementById('donor-name').value = '';
            fetchLeaderboard();
        }

        fetchLeaderboard();
    </script>
</body>
    </html>
