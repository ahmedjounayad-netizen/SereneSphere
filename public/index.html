<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereneSphere - Modern Relaxation & Focus Hub</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent-glow: #6366f1;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        h1 { color: #818cf8; margin-bottom: 5px; font-size: 28px; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        /* Motivational Quote Box */
        .quote-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            font-style: italic;
            font-size: 13px;
            color: #d1d5db;
            margin-bottom: 25px;
            border-left: 4px solid var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }

        /* Breathing Animation UI */
        #relaxation-box {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #0d1322;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .breathing-circle {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #818cf8, #4f46e5);
            border-radius: 50%;
            margin: 15px auto;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
            animation: breathe 4s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scale(0.75); opacity: 0.4; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        /* Supporters Section */
        .box {
            margin-top: 25px;
            padding: 18px;
            background: #0d1322;
            border-radius: 12px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .box h3 { margin-top: 0; font-size: 15px; color: #e5e7eb; display: flex; align-items: center; gap: 8px; }
        ul { padding-left: 18px; color: var(--text-muted); margin: 8px 0 0 0; font-size: 14px; }
        li { margin-bottom: 6px; }

        /* Form to Add Supporter */
        .form-group {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }
        .form-group input {
            flex: 1;
            padding: 10px 14px;
            background: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: #818cf8; }
        .form-group button {
            width: auto;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SereneSphere</h1>
        <div class="subtitle">Your ultimate digital sanctuary for focus & relaxation.</div>

        <!-- Daily Vibe Quote -->
        <div class="quote-box" id="quote-text">
            "Breathe in deep, let go of tension, and focus on the present moment."
        </div>

        <button class="btn" onclick="toggleRelaxation()">Start Focus & Breathing Session</button>

        <!-- Interactive Breathing Module -->
        <div id="relaxation-box">
            <div class="breathing-circle"></div>
            <h3 id="breath-status" style="color: #818cf8; margin: 10px 0 5px 0;">Inhale Slowly...</h3>
            <p style="margin: 0; font-size: 13px; color: var(--text-muted);">Sync your breath with the glowing pulse.</p>
        </div>

        <!-- Coffee Heroes / Supporters Hub -->
        <div class="box">
            <h3>☕ Coffee Heroes (Supporters)</h3>
            <ul id="supporter-list">
                <li>Loading global supporters...</li>
            </ul>

            <!-- Add Support Form -->
            <div class="form-group">
                <input type="text" id="supporter-name" placeholder="Enter your name...">
                <button class="btn" onclick="addSupporter()">Support</button>
            </div>
        </div>
    </div>

    <script>
        // Relaxation Session Toggle
        let isRunning = false;
        let timer;
        function toggleRelaxation() {
            const box = document.getElementById('relaxation-box');
            const status = document.getElementById('breath-status');
            
            if (!isRunning) {
                box.style.display = 'block';
                isRunning = true;
                timer = setInterval(() => {
                    status.textContent = status.textContent.includes('Inhale') ? 'Exhale Gently...' : 'Inhale Slowly...';
                }, 4000);
            } else {
                box.style.display = 'none';
                isRunning = false;
                clearInterval(timer);
            }
        }

        // Fetch Supporters from Node.js Server
        async function loadSupporters() {
            try {
                const response = await fetch('/api/supporters');
                const data = await response.json();
                const listEl = document.getElementById('supporter-list');
                listEl.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `${item.name} — ${item.coffee}`;
                    listEl.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Add New Supporter via API
        async function addSupporter() {
            const nameInput = document.getElementById('supporter-name');
            const name = nameInput.value.trim();
            if (!name) return alert('Please enter your name!');

            try {
                const response = await fetch('/api/add-supporter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, coffee: '1 Coffee ☕' })
                });
                const result = await response.json();
                if (result.success) {
                    nameInput.value = '';
                    loadSupporters();
                }
            } catch (error) {
                console.error('Error adding supporter:', error);
            }
        }

        loadSupporters();
    </script>
</body>
    </html>
