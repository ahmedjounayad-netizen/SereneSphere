<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereneSphere - Global Relaxation & Support Hub</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            text-align: center;
        }
        h1 { color: #818cf8; margin-bottom: 4px; font-size: 26px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Breathing Section */
        #relaxation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #0d1322;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .breathing-circle {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #818cf8, #4f46e5);
            border-radius: 50%;
            margin: 15px auto;
            animation: breathe 4s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        /* Supporters Box */
        .box {
            margin-top: 20px;
            padding: 16px;
            background: #0d1322;
            border-radius: 16px;
            text-align: left;
            border: 1px solid var(--border);
        }
        .box h3 { margin: 0 0 10px 0; font-size: 14px; color: #e5e7eb; }
        ul { padding-left: 18px; color: var(--text-muted); margin: 0; font-size: 13px; }
        li { margin-bottom: 5px; }

        .form-group {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .form-group input {
            flex: 1;
            padding: 10px 12px;
            background: #1f2937;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus { border-color: #818cf8; }

        /* Coffee Support & Store Button */
        .support-links {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .support-btn {
            flex: 1;
            background: #1f2937;
            color: #f3f4f6;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            transition: 0.3s;
            display: inline-block;
            text-align: center;
        }
        .support-btn:hover { background: #374151; border-color: #818cf8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SereneSphere</h1>
        <div class="subtitle">Your ultimate sanctuary for focus, relaxation & peace.</div>

        <button class="btn" onclick="toggleRelaxation()">Start Focus & Breathing Session</button>

        <!-- Interactive Breathing Module with Sound Simulation -->
        <div id="relaxation-box">
            <div class="breathing-circle"></div>
            <h3 id="breath-status" style="color: #818cf8; margin: 10px 0 5px 0;">Inhale Slowly...</h3>
            <audio id="chill-audio" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>
            <button class="btn" style="background: #374151; font-size: 13px; padding: 8px; margin-top: 10px;" onclick="toggleAudio()">🔊 Toggle Rain Ambience</button>
        </div>

        <!-- Coffee Heroes / Supporters Hub -->
        <div class="box">
            <h3>☕ Coffee Heroes (Global Supporters)</h3>
            <ul id="supporter-list">
                <li>Loading supporters...</li>
            </ul>

            <div class="form-group">
                <input type="text" id="supporter-name" placeholder="Your name...">
                <button class="btn" style="width: auto; margin-top:0; padding: 10px 14px; font-size: 13px;" onclick="addSupporter()">Join</button>
            </div>
        </div>

        <!-- Real Payment & Store Links -->
        <div class="support-links">
            <a href="https://www.buymeacoffee.com" target="_blank" class="support-btn">☕ Buy Coffee</a>
            <a href="https://play.google.com" target="_blank" class="support-btn">📱 Get App</a>
        </div>
    </div>

    <script>
        let isRunning = false;
        let timer;
        const audio = document.getElementById('chill-audio');

        function toggleRelaxation() {
            const box = document.getElementById('relaxation-box');
            const status = document.getElementById('breath-status');
            
            if (!isRunning) {
                box.style.display = 'block';
                isRunning = true;
                audio.play().catch(e => console.log("Audio autoplay restricted"));
                timer = setInterval(() => {
                    status.textContent = status.textContent.includes('Inhale') ? 'Exhale Gently...' : 'Inhale Slowly...';
                }, 4000);
            } else {
                box.style.display = 'none';
                isRunning = false;
                audio.pause();
                clearInterval(timer);
            }
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        async function loadSupporters() {
            try {
                const response =/api/supporters';
                const res = await fetch('/api/supporters');
                const data = await res.json();
                const listEl = document.getElementById('supporter-list');
                listEl.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `${item.name} — ${item.coffee}`;
                    listEl.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        async function addSupporter() {
            const nameInput = document.getElementById('supporter-name');
            const name = nameInput.value.trim();
            if (!name) return alert('Please enter your name!');

            try {
                const response = await fetch('/api/add-supporter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, coffee: '1 Coffee ☕' })
                });
                const result = await response.json();
                if (result.success) {
                    nameInput.value = '';
                    loadSupporters();
                }
            } catch (error) {
                console.error('Error adding supporter:', error);
            }
        }

        loadSupporters();
    </script>
</body>
</html>
